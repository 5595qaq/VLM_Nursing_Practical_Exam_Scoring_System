services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vlm_eval
    ports:
      # Local tools only: the default postgres/postgres credentials must not be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vlm_eval"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment: &backend-environment
      # 自動覆蓋資料庫連線位址，指向上方的 db 容器
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/vlm_eval
      # Vertex AI / GCS 設定，實際數值請放在專案根目錄的 .env 檔案中（不會被 git 追蹤）
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      # google-auth 讀這個變數；ADC 檔沒有寫 project 時，可避免「No project ID could be determined」警告
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION:-global}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-3.1-pro-preview}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json
      - MAX_ACTIVE_VIDEOS_PER_EVALUATION=${MAX_ACTIVE_VIDEOS_PER_EVALUATION:-10}
      - GEMINI_GLOBAL_CONCURRENCY=${GEMINI_GLOBAL_CONCURRENCY:-5}
      - GEMINI_CALL_STAGGER_MS=${GEMINI_CALL_STAGGER_MS:-250}
      - GEMINI_RETRY_ATTEMPTS=${GEMINI_RETRY_ATTEMPTS:-5}
      - GEMINI_CALL_TIMEOUT_SECONDS=${GEMINI_CALL_TIMEOUT_SECONDS:-900}
      - GEMINI_QUEUE_RETRY_BASE_SECONDS=${GEMINI_QUEUE_RETRY_BASE_SECONDS:-60}
      - GEMINI_QUEUE_RETRY_MAX_SECONDS=${GEMINI_QUEUE_RETRY_MAX_SECONDS:-900}
      - GAZELLE_MODEL_NAME=${GAZELLE_MODEL_NAME:-gazelle_dinov2_vitb14_inout}
      - GAZELLE_MODEL_VERSION=${GAZELLE_MODEL_VERSION:-gazelle-dinov2-vitb14-inout-v1}
      - GAZELLE_INOUT_THRESHOLD=${GAZELLE_INOUT_THRESHOLD:-0.5}
      - GAZELLE_DOT_RADIUS=${GAZELLE_DOT_RADIUS:-10}
      # sop-video-skill：預設由 Vertex AI 上的 Gemini 執行；SOP_SKILL_PROVIDER=claude 改用 Vertex AI 上的 Claude
      - SOP_SKILL_PROVIDER=${SOP_SKILL_PROVIDER:-gemini}
      - SOP_SKILL_GEMINI_MODEL=${SOP_SKILL_GEMINI_MODEL:-gemini-4-argon}
      - SOP_SKILL_GEMINI_THINKING_LEVEL=${SOP_SKILL_GEMINI_THINKING_LEVEL:-}
      - SOP_SKILL_GEMINI_MAX_OUTPUT_TOKENS=${SOP_SKILL_GEMINI_MAX_OUTPUT_TOKENS:-0}
      - CLAUDE_MODEL_NAME=${CLAUDE_MODEL_NAME:-claude-opus-5-5}
      - CLAUDE_VERTEX_REGION=${CLAUDE_VERTEX_REGION:-global}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-high}
      - CLAUDE_MAX_TOKENS=${CLAUDE_MAX_TOKENS:-64000}
      - CLAUDE_CALL_TIMEOUT_SECONDS=${CLAUDE_CALL_TIMEOUT_SECONDS:-900}
      # 選填：各模型每 1M token 的美元單價（JSON），用來估計成本；token 用量不論是否設定都會記錄
      - MODEL_PRICES_JSON
      - SOP_SKILL_CONCURRENCY=${SOP_SKILL_CONCURRENCY:-2}
      - SOP_SKILL_MAX_TURNS=${SOP_SKILL_MAX_TURNS:-60}
      - SOP_SKILL_DIR=/sop-video-skill
      - SOP_GRADING_DIR=/sop-video-grading
    volumes:
      # 將本機下載的 service account 金鑰掛載進容器，路徑對應上面的 GOOGLE_APPLICATION_CREDENTIALS
      - ${GCP_SA_KEY_PATH:-./secrets/gcp-key.json}:/secrets/gcp-key.json:ro
    depends_on:
      init:
        condition: service_completed_successfully

  init:
    build: ./backend
    environment: *backend-environment
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    environment: *backend-environment
    command: ["pgq", "run", "app.worker:main"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${GCP_SA_KEY_PATH:-./secrets/gcp-key.json}:/secrets/gcp-key.json:ro
      # skill 位於 build context（./backend）之外，以唯讀方式掛載給 worker 執行
      - ./sop-video-skill:/sop-video-skill:ro
      - ./sop-video-grading:/sop-video-grading:ro
    depends_on:
      init:
        condition: service_completed_successfully

  gazelle-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gazelle
      args:
        GAZELLE_REF: ${GAZELLE_REF:-main}
    environment: *backend-environment
    command: ["pgq", "run", "app.gazelle_worker:main"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ${GCP_SA_KEY_PATH:-./secrets/gcp-key.json}:/secrets/gcp-key.json:ro
      - ${GAZELLE_CHECKPOINT_PATH:-./models/gazelle.pt}:/models/gazelle.pt:ro
      - gazelle_torch_cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  gazelle_torch_cache:
