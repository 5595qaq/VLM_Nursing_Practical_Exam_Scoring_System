name: Claude Code Review

# 觸發條件：PR 開啟、推送新提交、重新開啟、或從草稿轉為可審查時
# （草稿 PR 與 fork 來的 PR 不會被審查：fork 的 PR 拿不到 secrets）
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 同一個 PR 連續推送時，取消還在跑的舊審查，只審最新的提交
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # write：審查結果要以留言貼回 PR（read 時只能讀，留言會失敗）
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 審查結果以行內留言貼在 PR 上；沒發現問題時貼一則摘要留言
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # code-review 外掛先用 gh 讀取 PR 狀態與 diff，再留言；只開放行內留言工具時，
          # 它讀不到 PR 就會直接結束（約 5 秒、不留言，卻顯示成功）。
          # gh 工具清單取自外掛 commands/code-review.md 的 allowed-tools。
          # 外掛還會派子代理平行檢查（規範、bug、驗證），需要子代理工具與唯讀檔案工具；
          # 少了它們 Claude 只能簡化審查（#51 只讀了 3 個檔案就留言 No issues found）。
          # 子代理工具新版叫 Agent、舊版叫 Task，兩個都列以相容不同版本。
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Agent,Task,Read,Glob,Grep"
          # 暫時開啟：在 Actions log 顯示 Claude 的完整輸出，確認真的有審查；確認後可移除
          show_full_output: true
