name: Python 自動化測試 (Pytest CI)

# 觸發條件：當有人 push 到 main 或 release/* 維護分支，或發起針對它們的 Pull Request 時
on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  test-logic:
    # 使用 GitHub 提供的最新版 Ubuntu 虛擬伺服器
    runs-on: ubuntu-latest

    steps:
    # 1. 取得專案原始碼
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # check_versions.py 要找 PR 與目標分支的 merge-base

    # 2. 安裝 Python 環境 (建議指定你開發用的版本，例如 3.10)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 2b. SOP 規則版本（見 AGENTS.md「多人協作」）：分支版本（例如 0.29-10b.1）要改成正式版本才能合併；
    #     PR 改了 SKILL.md／rubric.json／切分 references 時，版本要比目標分支大，CHANGELOG 要有該版本的標題
    - name: Check SOP rule versions
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python sop-video-grading/scripts/check_versions.py --base "origin/${{ github.base_ref }}"
        else
          python sop-video-grading/scripts/check_versions.py
        fi

    # 3. 安裝必要套件 (pytest, fastapi, sqlalchemy 等)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install httpx pytest-asyncio

    # 3b. ffmpeg：sop-video-skill／sop-video-grading 的影片腳本測試需要，沒有時這些測試會被略過
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    # 3c. 前端純函式測試（csv-export、recovery、sop-result、sop-grading）
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run frontend tests
      run: |
        node frontend/csv-export.test.js
        node frontend/recovery.test.js
        node frontend/sop-result.test.js
        node frontend/sop-grading.test.js

    # 4. 準備與執行 PostgreSQL (Test DB)
    - name: Start PostgreSQL container
      run: |
        docker run --name test-postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=vlm_eval_test -p 5432:5432 -d postgres:15
        # 簡單等待 DB 啟動
        sleep 5

    # 5. SOP skill 的 schema／結果驗證測試（不需要資料庫）
    - name: Run SOP skill script tests
      run: |
        pip install -r tests/sop_skill/requirements.txt
        pytest tests/sop_skill/ -v

    # 5b. SOP 評分的 rubric／程式判定／結果驗證測試（不需要資料庫）
    - name: Run SOP grading script tests
      run: |
        pip install -r tests/sop_grading/requirements.txt
        pytest tests/sop_grading/ -v

    # 6. 執行測試！
    - name: Run Pytest
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vlm_eval_test
      run: |
        # 到後端目錄並執行 pytest
        pytest backend/tests/ -v
